<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>HALO - 液压联动猝发版</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #0d1310;
  }
</style>
</head>
<body>

<svg id="halo-svg" xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <style>
    .h-glow   { opacity: 0.4; stroke: #8fb3a6; fill: none; }
    .h-sparse { opacity: 0.8; stroke: #cfe7df; fill: none; stroke-linecap: butt; }
    .h-ring   { opacity: 0.6; stroke: #bfe0d6; fill: none; }
    .h-paired { opacity: 0.8; stroke: #d6ece4; fill: none; stroke-linecap: butt; }
    .h-dense  { opacity: 0.8; stroke: #c4e0d8; fill: none; stroke-linecap: butt; }
    .h-sparse, .h-paired, .h-dense { transform-origin: 200px 200px; }

    /* 闪烁 */
    .h-glow   { animation: flicker-glow 3s infinite; }
    .h-sparse { animation: flicker-sparse 5s infinite, rotate-sparse 23s infinite; }
    .h-ring   { animation: flicker-ring 7s infinite; }
    .h-paired { animation: flicker-paired 11s infinite, rotate-paired 29s infinite; }
    .h-dense  { animation: flicker-dense 13s infinite, rotate-dense 31s infinite; }

    @keyframes flicker-glow {
      0%,100%{opacity:.4} 42%{opacity:.4} 43%{opacity:0} 44%{opacity:.4} 45%{opacity:.1} 46%{opacity:.4}
      78%{opacity:.4} 79%{opacity:0} 80%{opacity:.4}
    }
    @keyframes flicker-sparse {
      0%,100%{opacity:.8} 30%{opacity:.8} 31%{opacity:0} 32%{opacity:.8} 33%{opacity:.1} 34%{opacity:.8}
      65%{opacity:.8} 66%{opacity:0} 67%{opacity:.8}
    }
    @keyframes flicker-ring {
      0%,100%{opacity:.6} 53%{opacity:.6} 54%{opacity:0} 55%{opacity:.6}
      89%{opacity:.6} 90%{opacity:.1} 91%{opacity:.6}
    }
    @keyframes flicker-paired {
      0%,100%{opacity:.8} 23%{opacity:.8} 24%{opacity:0} 25%{opacity:.8} 26%{opacity:.1} 27%{opacity:.8}
      61%{opacity:.8} 62%{opacity:0} 63%{opacity:.8}
    }
    @keyframes flicker-dense {
      0%,100%{opacity:.8} 17%{opacity:.8} 18%{opacity:0} 19%{opacity:.8}
      47%{opacity:.8} 48%{opacity:.1} 49%{opacity:.8}
      73%{opacity:.8} 74%{opacity:0} 75%{opacity:.8}
    }

    @keyframes rotate-sparse {
      0%,10%{transform:rotate(0deg)}
      10%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      20%{transform:rotate(60deg)} 20%,30%{transform:rotate(60deg)}
      30%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      45%{transform:rotate(120deg)} 45%,60%{transform:rotate(120deg)}
      60%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      75%{transform:rotate(240deg)} 75%,90%{transform:rotate(240deg)}
      90%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      100%{transform:rotate(360deg)}
    }
    @keyframes rotate-paired {
      0%,15%{transform:rotate(0deg)}
      15%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      25%{transform:rotate(-90deg)} 25%,40%{transform:rotate(-90deg)}
      40%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      55%{transform:rotate(-180deg)} 55%,70%{transform:rotate(-180deg)}
      70%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      85%{transform:rotate(-270deg)} 85%,95%{transform:rotate(-270deg)}
      95%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      100%{transform:rotate(-360deg)}
    }
    @keyframes rotate-dense {
      0%,5%{transform:rotate(0deg)}
      5%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      15%{transform:rotate(45deg)} 15%,25%{transform:rotate(45deg)}
      25%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      35%{transform:rotate(90deg)} 35%,50%{transform:rotate(90deg)}
      50%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      65%{transform:rotate(180deg)} 65%,80%{transform:rotate(180deg)}
      80%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      90%{transform:rotate(270deg)} 90%,95%{transform:rotate(270deg)}
      95%{animation-timing-function:cubic-bezier(.4,0,.2,1)}
      100%{transform:rotate(360deg)}
    }
  </style>

  <g>
    <circle id="l2" class="h-glow" cx="200" cy="200" r="41" stroke-width="82"/>
    <circle id="l3" class="h-sparse" cx="200" cy="200" r="122" stroke-width="10"
            pathLength="360" stroke-dasharray="1.1 18.9"/>
    <circle id="l4" class="h-ring" cx="200" cy="200" r="137" stroke-width="2"/>
    <circle id="l5" class="h-paired" cx="200" cy="200" r="157" stroke-width="12"
            pathLength="360" stroke-dasharray="1 2.6 1 19.4"/>
    <circle id="l6" class="h-dense" cx="200" cy="200" r="177" stroke-width="8"
            pathLength="360" stroke-dasharray="0.65 4.35"/>
  </g>
</svg>

<script>
(function() {
  const GAP = 3;           // 层间最小安全间隙
  const MIN_THICKNESS = 1.5; // 环的最小厚度，防止挤压消失
  const MAX_R = 195;       // 画布物理边界

  const layers = [
    { id:'l2', iInt:2200, oInt:3100, tDur:600 },
    { id:'l3', iInt:2800, oInt:3700, tDur:500 },
    { id:'l4', iInt:3400, oInt:4300, tDur:450 },
    { id:'l5', iInt:4100, oInt:5200, tDur:550 },
    { id:'l6', iInt:4800, oInt:6100, tDur:500 },
  ];

  const els = layers.map(l => document.getElementById(l.id));

  // 初始化合理状态，避免开局重叠
  const initBounds = [
    { i: 20, o: 80 }, { i: 115, o: 125 }, { i: 136, o: 138 },
    { i: 150, o: 162 }, { i: 175, o: 185 }
  ];

  const state = layers.map((l, idx) => ({
    inner: { 
      current: initBounds[idx].i, target: initBounds[idx].i, from: initBounds[idx].i, 
      startTime: 0, dur: l.tDur, nextPulse: 0, interval: l.iInt, tDur: l.tDur 
    },
    outer: { 
      current: initBounds[idx].o, target: initBounds[idx].o, from: initBounds[idx].o, 
      startTime: 0, dur: l.tDur, nextPulse: 0, interval: l.oInt, tDur: l.tDur 
    },
  }));

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function nextPulseTime(now, avgInterval) {
    return now + avgInterval * (0.3 + Math.random() * 2.2); // 心律失常间隔
  }

  const now0 = performance.now();
  state.forEach(s => {
    s.inner.nextPulse = now0 + Math.random() * s.inner.interval;
    s.outer.nextPulse = now0 + Math.random() * s.outer.interval;
  });

  function updateChannel(ch, now, layerIndex, channelType) {
    if (now >= ch.nextPulse) {
      ch.from = ch.current;
      
      // 【核心改动】：获取所有层的实时物理边界，动态计算当前的合法随机池
      const bounds = state.map(s => ({ i: s.inner.current, o: s.outer.current }));
      let dynMin, dynMax;
      
      if (channelType === 'inner') {
        // 内径下限：受内层外径实时压制 (L2可直达0)
        dynMin = (layerIndex === 0) ? 0 : bounds[layerIndex - 1].o + GAP;
        // 内径上限：受自身外径和外层内径的双重实时限制
        const maxBySelf = bounds[layerIndex].o - MIN_THICKNESS;
        const maxByOuter = (layerIndex === 4) ? MAX_R - MIN_THICKNESS : bounds[layerIndex + 1].i - GAP - MIN_THICKNESS;
        dynMax = Math.min(maxBySelf, maxByOuter);
      } else {
        // 外径下限：受自身内径实时支撑
        dynMin = bounds[layerIndex].i + MIN_THICKNESS;
        // 外径上限：受外层内径实时压制 (L6可达画布边缘)
        dynMax = (layerIndex === 4) ? MAX_R : bounds[layerIndex + 1].i - GAP;
      }
      
      // 如果空间被极度挤压，连最小厚度都放不下，则放弃本次脉冲
      if (dynMin > dynMax) {
        ch.nextPulse = nextPulseTime(now, ch.interval);
        return; 
      }
      
      // 在动态计算的合法范围内随机生成新目标
      ch.target = dynMin + Math.random() * (dynMax - dynMin);
      ch.startTime = now;
      ch.dur = ch.tDur * (0.6 + Math.random() * 0.8);
      ch.nextPulse = nextPulseTime(now + ch.dur, ch.interval);
    }

    // 缓动插值
    if (now < ch.startTime + ch.dur) {
      const progress = (now - ch.startTime) / ch.dur;
      const eased = easeOutCubic(Math.min(progress, 1));
      ch.current = ch.from + (ch.target - ch.from) * eased;
    } else {
      ch.current = ch.target;
    }
  }

  function tick(now) {
    // 1. 更新所有通道的猝发状态
    for (let i = 0; i < state.length; i++) {
      updateChannel(state[i].inner, now, i, 'inner');
      updateChannel(state[i].outer, now, i, 'outer');
    }

    // 2. 强制约束传播 (安全网：防止缓动过渡过程中的物理穿模)
    for (let iter = 0; iter < 3; iter++) {
      for (let i = 0; i < state.length; i++) {
        if (i === 0) state[i].inner.current = Math.max(0, state[i].inner.current);
        else state[i].inner.current = Math.max(state[i-1].outer.current + GAP, state[i].inner.current);
        
        if (i === state.length - 1) state[i].outer.current = Math.min(MAX_R, state[i].outer.current);
        else state[i].outer.current = Math.min(state[i+1].inner.current - GAP, state[i].outer.current);
        
        if (state[i].outer.current < state[i].inner.current + MIN_THICKNESS) {
           if (i === state.length - 1 || state[i].outer.current + MIN_THICKNESS <= state[i+1].inner.current - GAP) {
              state[i].outer.current = state[i].inner.current + MIN_THICKNESS;
           } else {
              state[i].inner.current = state[i].outer.current - MIN_THICKNESS;
           }
        }
      }
    }

    // 3. 写回DOM
    for (let i = 0; i < state.length; i++) {
      const cInner = state[i].inner.current;
      const cOuter = state[i].outer.current;
      const newR = (cInner + cOuter) / 2;
      const newSW = cOuter - cInner;
      els[i].setAttribute('r', newR.toFixed(2));
      els[i].setAttribute('stroke-width', Math.max(newSW, 0.1).toFixed(2));
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>

</body>
</html>
